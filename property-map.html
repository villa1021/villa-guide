<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f5f1e8"><title>Property map · Villa 1021</title>
<style>*{box-sizing:border-box}html{overflow-anchor:none}body{margin:0;background:#f5f1e8;color:#171717;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header,main{max-width:864px;margin:auto}header{padding:12px max(16px,env(safe-area-inset-left)) 8px}nav{display:flex;justify-content:space-between;align-items:center;gap:12px}a,button{color:#75501f;min-height:44px;display:inline-flex;align-items:center;padding:10px 12px;border-radius:10px}button{font:inherit;background:#fff;border:1px solid #ded8cf;cursor:pointer}a:focus-visible,button:focus-visible{outline:3px solid #75501f;outline-offset:2px}h1{font:30px Georgia,serif;margin:12px 0 4px}p{margin:4px 0 12px;color:#645e55}#viewer{width:100%;overflow:auto;-webkit-overflow-scrolling:touch;background:#bcebd8}img{display:block;width:100%;height:auto;max-width:none;cursor:zoom-in}#viewer.zoomed img{width:200%;cursor:zoom-out}footer{max-width:864px;margin:auto;padding:12px 16px max(16px,env(safe-area-inset-bottom))}noscript{display:block;padding:8px}button[hidden]{display:none}</style></head>
<body><header><nav><a href="./#arrival">← Arrival directions</a><button id="zoom" type="button" aria-pressed="false" aria-controls="viewer" hidden>Zoom in</button></nav><h1>Property map</h1><p>Look for the gold star beside Villa 10. Tap any spot to zoom in there. Tap again to zoom out, or pinch to zoom.</p></header><main><div id="viewer"><img id="map" src="property-map.webp?v=portrait-amenities-v3" width="864" height="1821" alt="Portrait property map of the Villas at Norwich Inn. A gold star marks Villa 10 near Clubhouse 1. The spa is beside the main entrance from Route 32; the private entrance is on New London Turnpike." fetchpriority="high"></div><noscript>Pinch to zoom in your browser.</noscript></main><footer><a href="property-map.webp?v=portrait-amenities-v3">Open full-size image</a></footer>
<script>const viewer=document.getElementById('viewer'),map=document.getElementById('map'),zoom=document.getElementById('zoom');
zoom.hidden=false;
const clamp=(value,min,max)=>Math.min(max,Math.max(min,value));
function toggleAt(clientX,clientY){
 const before=map.getBoundingClientRect();
 if(!before.width||!before.height)return;
 const x=clamp((clientX-before.left)/before.width,0,1);
 const y=clamp((clientY-before.top)/before.height,0,1);
 const on=viewer.classList.toggle('zoomed');
 zoom.setAttribute('aria-pressed',String(on));
 zoom.textContent=on?'Fit to screen':'Zoom in';
 const after=map.getBoundingClientRect();
 const frame=viewer.getBoundingClientRect();
 viewer.scrollLeft=clamp(x*after.width-(clientX-frame.left),0,viewer.scrollWidth-viewer.clientWidth);
 window.scrollTo({left:window.scrollX,top:window.scrollY+after.top+y*after.height-clientY,behavior:'instant'});
}
zoom.addEventListener('click',()=>{
 const rect=map.getBoundingClientRect();
 const frame=viewer.getBoundingClientRect();
 const visibleTop=Math.max(0,rect.top),visibleBottom=Math.min(window.innerHeight,rect.bottom);
 toggleAt(frame.left+viewer.clientWidth/2,visibleBottom>visibleTop?(visibleTop+visibleBottom)/2:clamp(window.innerHeight/2,rect.top,rect.bottom));
});
let start=null,moved=false;
map.addEventListener('pointerdown',event=>{start={x:event.clientX,y:event.clientY};moved=false;});
map.addEventListener('pointermove',event=>{if(start&&Math.hypot(event.clientX-start.x,event.clientY-start.y)>10)moved=true;});
map.addEventListener('pointercancel',()=>{start=null;moved=true;});
map.addEventListener('click',event=>{if(!moved)toggleAt(event.clientX,event.clientY);start=null;});
</script></body></html>
