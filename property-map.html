<body><header><nav><a href="./#arrival">← Arrival directions</a><button id="zoom" type="button" aria-pressed="false" aria-controls="viewer" hidden>Zoom in</button></nav><h1>Property map</h1><p>Look for the gold star beside Villa 10. Pinch to zoom, or tap the map.</p></header><main><div id="viewer"><img id="map" src="property-map.webp?v=portrait-green-v2" width="864" height="1821" alt="Portrait property map of the Villas at Norwich Inn. A gold star marks Villa 10 near Clubhouse 1. The spa is beside the main entrance from Route 32; the private entrance is on New London Turnpike." fetchpriority="high"></div><noscript>Pinch to zoom in your browser.</noscript></main><footer><a href="property-map.webp?v=portrait-green-v2">Open full-size image</a></footer>
